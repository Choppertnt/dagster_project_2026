runLauncher:
  type: K8sRunLauncher
  config:
    k8sRunLauncher:
      imagePullPolicy: "Always"
      envSecrets:
        - name: db-dagster
        - name: health-secret
      runK8sConfig:
        jobSpecConfig:
          ttlSecondsAfterFinished: 600
      envVars:
        - "AWS_ENDPOINT_URL=http://minio.minio.svc.cluster.local:9000"
computeLogManager:
  type: S3ComputeLogManager
  config:
    s3ComputeLogManager:
      bucket: "dagster-logs" 
      prefix: "dagster" # แนะนำให้ใส่ prefix เพื่อให้ log เป็นระเบียบ
      endpoint_url: "http://minio.minio.svc.cluster.local:9000" 
      # 🚨 ทริคสำคัญสำหรับ MinIO: ต้องบังคับให้ใช้ path-style
      use_ssl: false # ถ้า MinIO ในคลัสเตอร์ไม่ได้ใช้ HTTPS ให้ใส่เป็น false
      kwargs:
        endpoint_url: "http://minio.minio.svc.cluster.local:9000"

postgresql:
  enabled: false 
  postgresqlHost: "internal-postgres-postgresql.postgresql.svc.cluster.local"
  postgresqlUsername: "dagster_user" 
  postgresqlDatabase: "dagster_metadata"
  postgresqlPort: 5432